server {
    listen 80;
    listen [::]:80;
    server_name restaurantos.peculiex.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/restaurant-os/acme;
    }

    location / {
        return 308 https://restaurantos.peculiex.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name restaurantos.peculiex.com;

    ssl_certificate /etc/letsencrypt/live/restaurantos.peculiex.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/restaurantos.peculiex.com/privkey.pem;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/ {
        client_max_body_size 7m;
        proxy_pass http://127.0.0.1:4200;
    }

    location / {
        proxy_pass http://127.0.0.1:3200;
    }
}
